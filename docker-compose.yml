services:
  data-governance:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: deacero-data-governance
    environment:
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/service-account-key.json
    volumes:
      - ./deacero-datagov-sa-key.json:/app/credentials/service-account-key.json:ro
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
      - logs:/app/logs
    networks:
      - governance-network
    restart: unless-stopped
    
  # Servicio para ejecutar catalogación
  catalog-automation:
    extends: data-governance
    container_name: deacero-catalog-automation
    command: ["python", "scripts/catalog_automation.py"]
    
    
  # Nota: Enmascaramiento de datos y Aspect Types se configuran en GCP Console

networks:
  governance-network:
    driver: bridge

volumes:
  logs:
    driver: local

